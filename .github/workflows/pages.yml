name: Publicar portafolio

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Preparar portafolio
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio con versión automática
        env:
          BUILD_VERSION: ${{ github.sha }}
        run: |
          mkdir -p _site

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            ./ _site/

          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["BUILD_VERSION"]

          files_to_update = (
              "index.html",
              "script.js",
          )

          for relative_path in files_to_update:
              path = Path("_site") / relative_path

              if not path.exists():
                  print(f"Aviso: no se encontró {relative_path}. Se omitirá.")
                  continue

              content = path.read_text(encoding="utf-8")
              content = content.replace("__BUILD_VERSION__", version)
              path.write_text(content, encoding="utf-8")

              print(f"Versión aplicada a {relative_path}")

          PY

          touch _site/.nojekyll

      - name: Subir archivos de GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    name: Publicar portafolio
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4