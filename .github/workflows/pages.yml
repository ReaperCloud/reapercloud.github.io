name: Publicar portafolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio con versión automática
        env:
          BUILD_VERSION: ${{ github.sha }}
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            ./ _site/

          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["BUILD_VERSION"]

          for relative_path in ("index.html", "script.js"):
              path = Path("_site") / relative_path
              content = path.read_text(encoding="utf-8")
              content = content.replace("__BUILD_VERSION__", version)
              path.write_text(content, encoding="utf-8")
          PY

          touch _site/.nojekyll

      - name: Subir archivos de GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
